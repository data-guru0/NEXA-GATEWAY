services:
  nexa-gateway:
    build: .
    image: nexa-gateway:local
    ports:
      - "${NEXA_PORT:-8080}:8080"
    environment:
      JEV_API_KEY: "${JEV_API_KEY:-}"
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY:-}"
    volumes:
      - nexa-data:/data
    restart: unless-stopped

volumes:
  nexa-data:
